name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Root install also runs the postinstall that installs backend deps.
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
